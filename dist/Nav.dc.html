<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<header style="width:100%;background:#ffffff;border-bottom:1px solid #E4E4E4;font-family:'IBM Plex Sans',sans-serif;">
  <div style="max-width:1200px;margin:0 auto;padding:0 40px;height:76px;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M2 25 L11 8 L15.5 16 L18.5 11 L28 25 Z" fill="#233C43"/>
        <path d="M11 8 L15.5 16 L12.5 16 L9.5 11 Z" fill="#E97132"/>
      </svg>
      <span style="display:flex;flex-direction:column;line-height:1;">
        <span style="font-family:'Source Serif 4',serif;font-weight:600;font-size:19px;color:#1F2426;letter-spacing:-0.2px;">Alpine Asset</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:2.4px;color:#8A9296;margin-top:3px;">RESEARCH GROUP</span>
      </span>
    </a>
    <nav style="display:flex;align-items:center;gap:38px;">
      <a href="index.html" style="{{ homeStyle }}">Home</a>
      <a href="research.html" style="{{ researchStyle }}">Research</a>
      <a href="about.html" style="{{ aboutStyle }}">About</a>
      <a href="contact.html" style="{{ contactStyle }};padding:9px 18px;border:1px solid #D3D6D8;border-radius:2px;color:#1F2426;">Contact</a>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;76&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;research&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const base = "font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;transition:color .15s;";
    const link = (key) => base + (active === key ? "color:#E8601C;font-weight:600;" : "color:#4A5257;font-weight:500;");
    return {
      homeStyle: link('home'),
      researchStyle: link('research'),
      aboutStyle: link('about'),
      contactStyle: base + (active === 'contact' ? "color:#E8601C;font-weight:600;" : "color:#1F2426;font-weight:500;"),
    };
  }
}
</script>
</body>
</html>
