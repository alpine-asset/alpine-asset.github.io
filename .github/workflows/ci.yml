name: CI

# Runs on every pull request and on every branch push that is NOT main
# (pushes to main are handled by deploy.yml, which runs the same checks).
# This is the green ✓ / red ✗ you see on a pull request BEFORE merging it:
# if it is red, do not merge — the site would break or fail to publish.
on:
  pull_request:
  push:
    branches-ignore: [main]

# Least privilege: this workflow only reads the checked-out code. Being
# explicit means a compromised or over-eager action can't use the job's token
# to write to the repo, regardless of the repository's default token setting.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci

      # The whole gate, defined once in package.json's `verify` script:
      # format check, ESLint, Stylelint (token discipline), type + frontmatter
      # check, unit tests, then build + link/PDF/image resolution. Keeping it in
      # one script means CI and deploy.yml can never drift apart.
      - name: Verify
        run: npm run verify
